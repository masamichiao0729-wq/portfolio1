<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>岡崎 真道 | Portfolio</title>
  <meta name="description" content="自販機で作品を「購入」して見る、インタラクティブ3Dポートフォリオ。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05070f;
      --panel: rgba(10, 16, 30, 0.82);
      --panel-solid: #0b1222;
      --line: rgba(0, 240, 255, 0.28);
      --line-strong: rgba(0, 240, 255, 0.7);
      --accent: #00f0ff;
      --accent-soft: rgba(0, 240, 255, 0.12);
      --accent-glow: 0 0 18px rgba(0, 240, 255, 0.45);
      --gold: #ffd27a;
      --gold-soft: rgba(255, 210, 122, 0.14);
      --text: #e6f1ff;
      --text-2: #b9c6de;
      --muted: #7b88a8;
      --radius: 10px;
      --font-display: 'Orbitron', 'Helvetica Neue', Arial, sans-serif;
      --font-body: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Helvetica Neue', Arial, sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background-color: var(--bg);
      overflow: hidden;
      font-family: var(--font-body);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    button { font-family: inherit; }
    #canvas-container { position: absolute; inset: 0; }

    .hidden { opacity: 0 !important; pointer-events: none !important; }
    /* 非表示要素の中のリンク・ボタンも確実にクリック不可にする */
    .hidden * { pointer-events: none !important; }
    .fade { transition: opacity 0.5s var(--ease); }

    /* ---------- 共通ボタン ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--accent);
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background 0.25s var(--ease), box-shadow 0.25s var(--ease), border-color 0.25s var(--ease), opacity 0.5s var(--ease), transform 0.25s var(--ease);
    }
    .btn:hover, .btn:focus-visible {
      background: rgba(0, 240, 255, 0.16);
      border-color: var(--accent);
      box-shadow: var(--accent-glow);
      outline: none;
    }
    .btn:active { transform: scale(0.97); }
    .icon-btn { width: 42px; height: 42px; padding: 0; justify-content: center; }
    .icon-btn svg { width: 18px; height: 18px; }

    /* ---------- ローディング ---------- */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: radial-gradient(ellipse at center, #0b1530 0%, var(--bg) 70%);
      transition: opacity 0.9s var(--ease);
      padding: 0 16px;
      text-align: center;
    }
    #loader .logo {
      font-family: var(--font-display);
      font-size: 1.1rem;
      letter-spacing: 0.5em;
      color: var(--text);
      text-shadow: var(--accent-glow);
      padding-left: 0.5em;
    }
    #loader .bar {
      width: min(280px, 70vw);
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }
    #loader .bar i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #8ffcff);
      box-shadow: var(--accent-glow);
      transition: width 0.25s linear;
    }
    #loader .status {
      font-family: var(--font-display);
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      color: var(--muted);
    }
    #loader.error .status { color: #ff8a8a; letter-spacing: 0.05em; font-family: var(--font-body); }

    /* ---------- 上部ナビ ---------- */
    #topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 95;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      pointer-events: none;
    }
    #topbar > * { pointer-events: auto; }
    #brand {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: opacity 0.5s var(--ease);
    }
    #brand .brand-main {
      display: block;
      font-family: var(--font-display);
      font-size: 1.05rem;
      letter-spacing: 0.22em;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
    }
    #brand .brand-sub {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      margin-top: 3px;
    }
    #nav { display: flex; gap: 10px; align-items: center; }
    .badge {
      font-family: var(--font-display);
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      color: var(--gold);
      background: var(--gold-soft);
      border: 1px solid rgba(255, 210, 122, 0.35);
      border-radius: 999px;
      padding: 2px 8px;
    }

    /* ---------- 案内メッセージ / 戻る ---------- */
    #hint-msg {
      position: fixed;
      top: 84px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid var(--line-strong);
      color: var(--accent);
      padding: 8px 22px;
      border-radius: 999px;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s var(--ease);
      z-index: 40;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: var(--accent-glow);
    }
    #back-btn { position: fixed; top: 84px; left: 24px; z-index: 45; }

    /* ---------- タイトル画面（Cut1） ---------- */
    #title-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 18px;
      padding: 0 16px 0 max(16px, 8vw);
      z-index: 30;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(5, 7, 15, 0.78) 0%, rgba(5, 7, 15, 0.35) 45%, rgba(5, 7, 15, 0) 75%);
      transition: opacity 0.8s var(--ease);
    }
    #title-screen > * { transition: transform 0.9s var(--ease), opacity 0.9s var(--ease); }
    #title-screen.hidden > * { transform: translateY(12px); }
    #title-screen .eyebrow {
      font-family: var(--font-display);
      font-size: 0.72rem;
      letter-spacing: 0.5em;
      color: var(--muted);
    }
    #title-screen .title {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 6.5vw, 4.6rem);
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #e9fdff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.9), 0 0 42px rgba(0, 240, 255, 0.45);
      animation: flicker 6s infinite;
    }
    #title-screen .tagline {
      font-size: 0.95rem;
      color: var(--text-2);
      letter-spacing: 0.12em;
      line-height: 1.9;
    }
    #title-screen .tagline a { color: var(--text-2); text-decoration: none; border-bottom: 1px dotted var(--muted); pointer-events: auto; }
    #title-screen .tagline a:hover { color: var(--accent); }
    .title-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 10px; pointer-events: auto; }
    #start-btn {
      font-size: 1rem;
      padding: 14px 56px;
      letter-spacing: 0.4em;
      border-color: var(--accent);
      background: rgba(0, 240, 255, 0.08);
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.35), inset 0 0 12px rgba(0, 240, 255, 0.15);
    }
    #start-btn:hover { background: var(--accent); color: var(--bg); box-shadow: 0 0 32px rgba(0, 240, 255, 0.8); }
    .text-link {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      padding: 8px 4px;
      border-bottom: 1px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .text-link:hover { color: var(--accent); border-color: var(--accent); }
    @keyframes flicker {
      0%, 92%, 100% { opacity: 1; }
      93% { opacity: 0.55; }
      94% { opacity: 1; }
      96% { opacity: 0.7; }
      97% { opacity: 1; }
    }

    /* ---------- ステップ表示 ---------- */
    #steps {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: opacity 0.5s var(--ease);
    }
    .step { display: flex; align-items: center; gap: 7px; color: var(--muted); font-family: var(--font-display); font-size: 0.62rem; letter-spacing: 0.16em; }
    .step .dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--muted); transition: all 0.4s var(--ease); }
    .step.done .dot { background: var(--line-strong); border-color: var(--line-strong); }
    .step.active { color: var(--accent); }
    .step.active .dot { background: var(--accent); border-color: var(--accent); box-shadow: var(--accent-glow); transform: scale(1.25); }
    .step-sep { width: 18px; height: 1px; background: var(--line); }
    #retry-btn { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); z-index: 45; }

    /* ---------- カーソル追従ラベル ---------- */
    #item-label {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 50;
      pointer-events: none;
      padding: 9px 14px 9px 12px;
      max-width: 290px;
      background: rgba(8, 13, 26, 0.92);
      border: 1px solid var(--line-strong);
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      box-shadow: var(--accent-glow);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    #item-label.show { opacity: 1; }
    #item-label.disabled { border-color: rgba(123, 136, 168, 0.6); box-shadow: none; }
    #item-label.disabled #item-label-title { color: var(--muted); }
    #item-label-no { font-family: var(--font-display); font-size: 0.6rem; letter-spacing: 0.2em; color: var(--muted); }
    #item-label-no .got { color: var(--gold); margin-left: 6px; }
    #item-label-title { font-size: 0.92rem; font-weight: 700; color: var(--accent); line-height: 1.45; }
    #item-label-sub { font-size: 0.7rem; color: var(--muted); margin-top: 2px; letter-spacing: 0.08em; }

    /* ---------- 作品モーダル ---------- */
    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 6, 14, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s var(--ease);
      padding: 16px;
    }
    #modal-overlay.open { opacity: 1; pointer-events: auto; }
    #modal-card {
      position: relative;
      width: min(920px, 100%);
      max-height: calc(100vh - 32px);
      overflow: auto;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      background: linear-gradient(160deg, rgba(16, 26, 48, 0.97), rgba(9, 14, 28, 0.97));
      border: 1px solid var(--line-strong);
      border-radius: 14px;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.25), 0 30px 80px rgba(0, 0, 0, 0.55);
      transform: translateY(18px) scale(0.98);
      transition: transform 0.45s var(--ease);
    }
    #modal-overlay.open #modal-card { transform: none; }
    #modal-media {
      position: relative;
      min-height: 320px;
      background: radial-gradient(ellipse at 30% 30%, rgba(0, 240, 255, 0.22), transparent 60%), linear-gradient(135deg, #0d1a33, #060a16);
      border-right: 1px solid var(--line);
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }
    #modal-media img, #modal-media iframe, #modal-media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border: 0; }
    #modal-media .placeholder { position: relative; padding: 28px; width: 100%; }
    #modal-media .placeholder .big-no {
      font-family: var(--font-display);
      font-size: clamp(4rem, 10vw, 7rem);
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1px rgba(0, 240, 255, 0.55);
      text-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
    }
    #modal-media .placeholder .ph-title { font-size: 1.05rem; color: var(--text-2); margin-top: 10px; letter-spacing: 0.08em; }
    #modal-media .grid-lines {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(0, 240, 255, 0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 240, 255, 0.07) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(180deg, transparent, #000 40%, #000);
      -webkit-mask-image: linear-gradient(180deg, transparent, #000 40%, #000);
    }
    #modal-body { padding: 30px 30px 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    #modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 2;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: var(--text-2);
      font-size: 1.3rem;
      cursor: pointer;
      background: rgba(5, 8, 16, 0.6);
      border: 1px solid var(--line);
      line-height: 1;
      transition: all 0.2s;
    }
    #modal-close:hover { color: var(--accent); border-color: var(--accent); box-shadow: var(--accent-glow); }
    .modal-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-right: 40px; }
    .chip {
      font-size: 0.72rem;
      padding: 3px 10px;
      background: var(--accent-soft);
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 999px;
      color: var(--accent);
      letter-spacing: 0.04em;
    }
    .chip.gold { color: var(--gold); background: var(--gold-soft); border-color: rgba(255, 210, 122, 0.4); }
    .chip.plain { color: var(--text-2); background: rgba(255, 255, 255, 0.04); border-color: rgba(255, 255, 255, 0.12); }
    #modal-no { font-family: var(--font-display); font-size: 0.7rem; letter-spacing: 0.25em; color: var(--muted); }
    #modal-title { font-size: clamp(1.3rem, 2.6vw, 1.7rem); color: var(--text); letter-spacing: 0.04em; line-height: 1.35; }
    #modal-role { font-size: 0.82rem; color: var(--accent); letter-spacing: 0.06em; }
    #modal-desc { font-size: 0.92rem; color: var(--text-2); line-height: 1.85; }
    #modal-tools { display: flex; flex-wrap: wrap; gap: 6px; }
    .modal-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
    .modal-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: var(--bg);
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid var(--accent);
      transition: 0.2s;
    }
    .modal-btn:hover { background: #fff; border-color: #fff; box-shadow: 0 0 18px var(--accent); }
    .modal-btn.ghost { background: transparent; color: var(--accent); }
    .modal-btn.ghost:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
    .modal-nav {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .modal-nav button {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      padding: 8px 6px;
      transition: color 0.2s;
      max-width: 40%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .modal-nav button:hover { color: var(--accent); }
    #modal-count { font-family: var(--font-display); font-size: 0.7rem; letter-spacing: 0.2em; color: var(--muted); }

    /* ---------- サイドパネル（WORKS / ABOUT） ---------- */
    #drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(4, 6, 14, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s var(--ease);
    }
    #drawer-backdrop.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed;
      top: 76px;
      right: 0;
      bottom: 0;
      z-index: 90;
      width: min(440px, 100%);
      background: linear-gradient(180deg, rgba(12, 20, 38, 0.97), rgba(7, 11, 22, 0.98));
      border-left: 1px solid var(--line);
      border-top: 1px solid var(--line);
      border-top-left-radius: 14px;
      box-shadow: -20px 0 60px rgba(0, 0, 0, 0.5);
      transform: translateX(104%);
      transition: transform 0.5s var(--ease);
      display: flex;
      flex-direction: column;
    }
    .drawer.open { transform: none; }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 22px 24px 14px; }
    .drawer-title { font-family: var(--font-display); font-size: 1rem; letter-spacing: 0.3em; color: var(--text); }
    .drawer-body { padding: 4px 24px 28px; overflow-y: auto; flex: 1; }
    .progress { margin-bottom: 18px; }
    .progress-label { display: flex; justify-content: space-between; font-family: var(--font-display); font-size: 0.66rem; letter-spacing: 0.18em; color: var(--muted); margin-bottom: 8px; }
    .progress-label b { color: var(--gold); font-weight: 400; }
    .progress-track { height: 4px; background: rgba(255, 255, 255, 0.07); border-radius: 4px; overflow: hidden; }
    .progress-track i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #ffb84d, var(--gold)); box-shadow: 0 0 12px rgba(255, 210, 122, 0.6); transition: width 0.6s var(--ease); }
    .work-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .work-item {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      gap: 12px;
      align-items: center;
      width: 100%;
      text-align: left;
      padding: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: var(--radius);
      color: var(--text);
      cursor: pointer;
      transition: all 0.25s var(--ease);
    }
    .work-item:hover, .work-item:focus-visible { border-color: var(--line-strong); background: var(--accent-soft); outline: none; transform: translateX(-3px); }
    .work-item .no { font-family: var(--font-display); font-size: 0.95rem; color: var(--accent); letter-spacing: 0.05em; }
    .work-item .t { font-size: 0.92rem; font-weight: 700; line-height: 1.4; }
    .work-item .d { font-size: 0.74rem; color: var(--muted); line-height: 1.6; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .work-item .state { font-family: var(--font-display); font-size: 0.6rem; letter-spacing: 0.12em; color: var(--muted); white-space: nowrap; }
    .work-item.got .state { color: var(--gold); }
    .work-item.got .no { color: var(--gold); }
    .drawer-note { font-size: 0.74rem; color: var(--muted); line-height: 1.7; margin-top: 18px; }
    .drawer-note button { color: var(--muted); }
    .about-name { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.1em; margin-top: 6px; }
    .about-school { color: var(--accent); font-size: 0.85rem; letter-spacing: 0.08em; margin-top: 4px; }
    .about-bio { color: var(--text-2); font-size: 0.9rem; line-height: 1.9; margin: 18px 0; }
    .about-section { margin-top: 24px; }
    .about-section h3 { font-family: var(--font-display); font-size: 0.7rem; letter-spacing: 0.3em; color: var(--muted); font-weight: 400; margin-bottom: 10px; }
    .howto { list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 8px; }
    .howto li { counter-increment: s; display: flex; gap: 12px; font-size: 0.84rem; color: var(--text-2); line-height: 1.6; }
    .howto li::before { content: '0' counter(s); font-family: var(--font-display); font-size: 0.72rem; color: var(--accent); padding-top: 2px; }

    /* ---------- トースト ---------- */
    #toast {
      position: fixed;
      left: 50%;
      top: 22px;
      transform: translate(-50%, -16px);
      z-index: 120;
      padding: 12px 22px;
      border-radius: 999px;
      background: rgba(20, 16, 6, 0.9);
      border: 1px solid rgba(255, 210, 122, 0.55);
      color: var(--gold);
      font-size: 0.88rem;
      letter-spacing: 0.08em;
      box-shadow: 0 0 24px rgba(255, 210, 122, 0.35);

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
    import { EXRLoader } from 'three/addons/loaders/EXRLoader.js';
    import GUI from 'three/addons/libs/lil-gui.module.min.js';

    // 任意のJSONを読み込む（無ければ null）
    async function loadOptionalJSON(url) {
      try {
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) return null;
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    // Blenderから書き出したライティング情報 / 調整済みルック設定（どちらも任意）
    const blenderData = await loadOptionalJSON('./lights.json');
    const savedLook = await loadOptionalJSON('./look.json');
    if (blenderData) console.log('[look] lights.json 読み込み:', blenderData.lights.length, '灯', blenderData);
    else console.log('[look] lights.json なし → v13 の固定ライトを使用');

    // GLTFLoaderは名前から「.」等を除去するので、元の名前は userData.name を見る
    const rawName = (obj) => (obj.userData && obj.userData.name) || obj.name || '';

    // ==========================================
    // 0. サウンド（柔らかいベル／カリンバ系の音色 ＋ 空気感のあるリバーブ）
    //    すべて Web Audio API でその場で合成（録音素材はコイン音と落下音のみ）
    // ==========================================
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let masterGain = null;   // 全体の音量（ミュート切替）
    let reverbSend = null;   // リバーブへ送るバス
    const MASTER_VOLUME = 0.9;
    const REVERB_RETURN = 0.55;

    const SOUND_PREF_KEY = 'vm-portfolio-sound';
    let soundOn = true;
    try { soundOn = localStorage.getItem(SOUND_PREF_KEY) !== 'off'; } catch (e) {}

    // 広い空間の残響（インパルス応答）をノイズから生成
    function createImpulse(ctx, seconds = 2.6, decay = 3.0) {
      const rate = ctx.sampleRate;
      const len = Math.floor(rate * seconds);
      const buf = ctx.createBuffer(2, len, rate);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        let lp = 0;
        for (let i = 0; i < len; i++) {
          const t = i / len;
          // 高域をなだらかに落として柔らかい響きに
          lp += (Math.random() * 2 - 1 - lp) * (0.55 - 0.4 * t);
          d[i] = lp * Math.pow(1 - t, decay);
        }
      }
      return buf;
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioCtx();
        const comp = audioCtx.createDynamicsCompressor();
        comp.threshold.value = -14;
        comp.ratio.value = 3;
        comp.connect(audioCtx.destination);

        masterGain = audioCtx.createGain();
        masterGain.gain.value = soundOn ? MASTER_VOLUME : 0;
        masterGain.connect(comp);

        const convolver = audioCtx.createConvolver();
        convolver.buffer = createImpulse(audioCtx);
        const ret = audioCtx.createGain();
        ret.gain.value = REVERB_RETURN;
        convolver.connect(ret);
        ret.connect(masterGain);

        reverbSend = audioCtx.createGain();
        reverbSend.connect(convolver);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      decodeSamples();
    }

    function setSoundOn(on) {
      soundOn = on;
      try { localStorage.setItem(SOUND_PREF_KEY, on ? 'on' : 'off'); } catch (e) {}
      if (masterGain) masterGain.gain.setTargetAtTime(on ? MASTER_VOLUME : 0, audioCtx.currentTime, 0.04);
      document.dispatchEvent(new CustomEvent('soundchange', { detail: on }));
    }

    // 出力先：ドライ（直接音）とリバーブへの送りを分けて接続
    function routeOut(node, wet = 0.4) {
      node.connect(masterGain);
      if (wet > 0) {
        const send = audioCtx.createGain();
        send.gain.value = wet;
        node.connect(send);
        send.connect(reverbSend);
      }
    }

    const now = () => audioCtx.currentTime;
    const midiToFreq = (m) => 440 * Math.pow(2, (m - 69) / 12);
    // D メジャー・ペンタトニック（D E F# A B）。どの音を重ねても濁らない
    const PENTA = [62, 64, 66, 69, 71];
    const pentaNote = (i, baseOctave = 1) => PENTA[((i % 5) + 5) % 5] + 12 * (baseOctave + Math.floor(i / 5));

    // ベル（FM合成：ガラスのような柔らかい金属音）
    function bell(freq, when = 0, { dur = 1.4, gain = 0.12, wet = 0.5, ratio = 2.0, index = 2.2 } = {}) {
      const t = Math.max(now(), when || now());
      const car = audioCtx.createOscillator();
      const mod = audioCtx.createOscillator();
      const modGain = audioCtx.createGain();
      const amp = audioCtx.createGain();
      car.type = 'sine';
      mod.type = 'sine';
      car.frequency.value = freq;
      mod.frequency.value = freq * ratio;
      modGain.gain.setValueAtTime(freq * index, t);
      modGain.gain.exponentialRampToValueAtTime(freq * 0.01, t + dur * 0.5);
      amp.gain.setValueAtTime(0.0001, t);
      amp.gain.exponentialRampToValueAtTime(gain, t + 0.006);
      amp.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      mod.connect(modGain);
      modGain.connect(car.frequency);
      car.connect(amp);
      routeOut(amp, wet);
      car.start(t); mod.start(t);
      car.stop(t + dur + 0.05); mod.stop(t + dur + 0.05);
    }

    // カリンバ／木琴（短く丸い「ポン」）
    function pluck(freq, when = 0, { dur = 0.45, gain = 0.1, wet = 0.35 } = {}) {
      const t = Math.max(now(), when || now());
      const amp = audioCtx.createGain();
      amp.gain.setValueAtTime(0.0001, t);
      amp.gain.exponentialRampToValueAtTime(gain, t + 0.004);
      amp.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      const lp = audioCtx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(freq * 6, t);
      lp.frequency.exponentialRampToValueAtTime(freq * 1.5, t + dur * 0.6);
      [[1, 'sine', 1], [2.01, 'triangle', 0.25], [4.2, 'sine', 0.08]].forEach(([mul, type, g]) => {
        const o = audioCtx.createOscillator();
        const og = audioCtx.createGain();
        o.type = type;
        o.frequency.value = freq * mul;
        og.gain.value = g;
        o.connect(og);
        og.connect(lp);
        o.start(t);
        o.stop(t + dur + 0.05);
      });
      lp.connect(amp);
      routeOut(amp, wet);
    }

    // 風が抜けるような「ヒュッ」（帯域を絞ったノイズのスイープ）
    let noiseBuffer = null;
    function whoosh(when = 0, { dur = 0.4, from = 400, to = 3200, gain = 0.08, wet = 0.5, q = 1.2 } = {}) {
      const t = Math.max(now(), when || now());
      if (!noiseBuffer) {
        noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
        const d = noiseBuffer.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      const src = audioCtx.createBufferSource();
      src.buffer = noiseBuffer;
      const bp = audioCtx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.Q.value = q;
      bp.frequency.setValueAtTime(from, t);
      bp.frequency.exponentialRampToValueAtTime(to, t + dur);
      const amp = audioCtx.createGain();
      amp.gain.setValueAtTime(0.0001, t);
      amp.gain.exponentialRampToValueAtTime(gain, t + dur * 0.45);
      amp.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(bp);
      bp.connect(amp);
      routeOut(amp, wet);
      src.start(t, Math.random());
      src.stop(t + dur + 0.05);
    }

    // きらめき（高いベルを細かくランダムに重ねる）
    function sparkle(when = 0, { count = 6, spread = 0.35, gain = 0.035 } = {}) {
      const t = Math.max(now(), when || now());
      for (let i = 0; i < count; i++) {
        const n = pentaNote(10 + Math.floor(Math.random() * 6));
        bell(midiToFreq(n), t + Math.random() * spread, { dur: 0.9, gain: gain * (0.6 + Math.random() * 0.6), wet: 0.8, ratio: 3.01, index: 1.2 });
      }
    }

    // ---------- 画面ごとの効果音 ----------
    // ① 商品ホバー：商品ごとに違う音程（棚をなぞるとメロディになる）
    function playHoverSE(noteIndex = 3) {
      initAudio();
      pluck(midiToFreq(pentaNote(noteIndex, 1)), 0, { gain: 0.07, dur: 0.5, wet: 0.4 });
    }
    // ② ボタンに触れた時のごく小さな音
    function playUITickSE() {
      initAudio();
      pluck(midiToFreq(pentaNote(8)), 0, { gain: 0.03, dur: 0.18, wet: 0.2 });
    }
    // ③ 決定（「見る」・自販機の選択）：上昇するベルのアルペジオ＋風
    function playConfirmSE() {
      initAudio();
      const t = now() + 0.01;
      [0, 2, 4, 5].forEach((step, i) => {
        bell(midiToFreq(pentaNote(step + 5)), t + i * 0.065, { gain: 0.09, dur: 1.3, wet: 0.55 });
      });
      whoosh(t, { dur: 0.45, from: 500, to: 4000, gain: 0.05 });
    }
    // 互換用（v17までの呼び出し名）
    const playSelectSE = playConfirmSE;
    // ④ 戻る：2音で下がる
    function playBackSE() {
      initAudio();
      const t = now() + 0.01;
      pluck(midiToFreq(pentaNote(8)), t, { gain: 0.07, dur: 0.4 });
      pluck(midiToFreq(pentaNote(5)), t + 0.08, { gain: 0.07, dur: 0.6 });
    }
    // ⑤ 商品を押した瞬間の「ポン」（このあとコイン音）
    function playPressSE(noteIndex = 3) {
      initAudio();
      bell(midiToFreq(pentaNote(noteIndex, 2)), 0, { gain: 0.07, dur: 0.8, wet: 0.5, ratio: 3.5, index: 1.5 });
    }
    // ⑥ 取り出し口に着地した直後：「手に入れた！」きらめき（オリジナルの短いフレーズ）
    function playGetSE() {
      initAudio();
      const t = now() + 0.06;
      [3, 5, 7, 9].forEach((step, i) => {
        bell(midiToFreq(pentaNote(step + 3)), t + i * 0.075, { gain: 0.08, dur: 1.6, wet: 0.6 });
      });
      bell(midiToFreq(pentaNote(5)), t + 0.3, { gain: 0.05, dur: 2.2, wet: 0.7, ratio: 1.0, index: 0.6 });
      sparkle(t + 0.25, { count: 7, spread: 0.5 });
    }
    // 落下音mp3が無い時の代わり（木の箱に当たるような「コトン」）
    function playDropClunkSE() {
      initAudio();
      const t = now();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(180, t);
      o.frequency.exponentialRampToValueAtTime(60, t + 0.15);
      g.gain.setValueAtTime(0.3, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      o.connect(g);
      routeOut(g, 0.2);
      o.start(t); o.stop(t + 0.25);
      pluck(midiToFreq(pentaNote(0)), t, { gain: 0.08, dur: 0.3, wet: 0.2 });
    }
    // ⑦ 作品ウィンドウを開く：ふわっと広がる和音
    function playModalOpenSE() {
      initAudio();
      const t = now() + 0.01;
      whoosh(t, { dur: 0.35, from: 300, to: 2500, gain: 0.06 });
      [0, 3, 7].forEach((step, i) => {
        bell(midiToFreq(pentaNote(step + 5)), t + 0.08 + i * 0.03, { gain: 0.06, dur: 2.0, wet: 0.7, ratio: 1.0, index: 0.8 });
      });
    }
    // ⑧ 作品ウィンドウを閉じる
    function playModalCloseSE() {
      initAudio();
      const t = now() + 0.01;
      whoosh(t, { dur: 0.25, from: 2400, to: 400, gain: 0.04 });
      pluck(midiToFreq(pentaNote(7)), t + 0.02, { gain: 0.05, dur: 0.4 });
      pluck(midiToFreq(pentaNote(5)), t + 0.09, { gain: 0.05, dur: 0.5 });
    }
    // ⑨ 作品の前後移動
    function playPageSE(dir = 1) {
      initAudio();
      whoosh(0, { dur: 0.18, from: dir > 0 ? 800 : 2400, to: dir > 0 ? 2400 : 800, gain: 0.03, wet: 0.3 });
      pluck(midiToFreq(pentaNote(dir > 0 ? 9 : 6)), 0, { gain: 0.04, dur: 0.3 });
    }
    // ⑩ 全作品コンプリート
    function playCompleteSE() {
      initAudio();
      const t = now() + 0.05;
      for (let i = 0; i < 9; i++) bell(midiToFreq(pentaNote(i + 3)), t + i * 0.06, { gain: 0.07, dur: 1.6, wet: 0.6 });
      [5, 7, 9, 12].forEach((s) => bell(midiToFreq(pentaNote(s)), t + 0.62, { gain: 0.05, dur: 2.8, wet: 0.75, ratio: 1.0, index: 0.7 }));
      sparkle(t + 0.6, { count: 10, spread: 0.8 });
    }

    // --- 録音素材の効果音（mp3） ---
    //   offset: 再生を始める位置（秒） / end: 再生を止める位置（秒・null なら最後まで）
    //   gain: 音量 / wet: リバーブへの送り量（空間に馴染ませる）
    const SAMPLE_FILES = {
      coin: { url: './coin_insert.mp3', offset: 0, end: null, gain: 0.75, wet: 0.3 },
      drop: { url: './jidouhanbaiki.mp3', offset: 0.45, end: 1.08, gain: 0.85, wet: 0.12 }
    };
    // jidouhanbaiki.mp3 で着地の「ガコン」が鳴る位置（秒）。この瞬間に缶が着地する
    const DROP_IMPACT_TIME = 1.01;
    const FALL_DURATION = DROP_IMPACT_TIME - SAMPLE_FILES.drop.offset; // ≒0.56秒
    const COIN_TO_DROP_OVERLAP = 0.03;

    const sampleRaw = {};
    const sampleBuffers = {};
    const sampleDecoding = {};
    Object.entries(SAMPLE_FILES).forEach(([key, def]) => {
      fetch(def.url)
        .then(res => (res.ok ? res.arrayBuffer() : null))
        .then(buf => { if (buf) { sampleRaw[key] = buf; decodeSamples(); } else console.warn(`[audio] ${def.url} が見つかりません（合成音で代用）`); })
        .catch(() => console.warn(`[audio] ${def.url} を読み込めませんでした（合成音で代用）`));
    });

    function decodeSamples() {
      if (!audioCtx) return;
      Object.keys(sampleRaw).forEach((key) => {
        if (sampleBuffers[key] || sampleDecoding[key]) return;
        sampleDecoding[key] = true;
        audioCtx.decodeAudioData(sampleRaw[key].slice(0))
          .then(buf => { sampleBuffers[key] = buf; })
          .catch(e => console.warn(`[audio] ${key} のデコードに失敗`, e));
      });
    }

    // オーディオの時計で再生を予約（when: AudioContext 時刻、0 なら今すぐ）
    // 戻り値 { start, duration, src }。未読込なら null
    const activeSources = new Set();
    function playSample(key, when = 0) {
      initAudio();
      const buf = sampleBuffers[key];
      if (!buf) return null;
      const def = SAMPLE_FILES[key];
      const start = Math.max(audioCtx.currentTime + 0.01, when);
      const end = Math.min(def.end ?? buf.duration, buf.duration);
      const duration = end - def.offset;
      const src = audioCtx.createBufferSource();
      const gain = audioCtx.createGain();
      const fade = Math.min(0.05, duration / 4);
      gain.gain.setValueAtTime(def.gain, start);
      gain.gain.setValueAtTime(def.gain, start + duration - fade);
      gain.gain.linearRampToValueAtTime(0.0001, start + duration);
      src.buffer = buf;
      src.connect(gain);
      routeOut(gain, def.wet);
      src.start(start, def.offset, duration);
      activeSources.add(src);
      src.onended = () => activeSources.delete(src);
      return { start, duration, src };
    }

    function stopAllSamples() {
      activeSources.forEach((src) => { try { src.stop(); } catch (e) {} });
      activeSources.clear();
    }

    // いま耳に届いているオーディオ時刻（出力遅延を差し引く）
    function heardAudioTime() {
      if (!audioCtx) return 0;
      return audioCtx.currentTime - (audioCtx.outputLatency || audioCtx.baseLatency || 0);
    }

    // ==========================================
    // 1. シーン・カメラ・レンダラー初期化
    // ==========================================
    const container = document.getElementById('canvas-container');
    const hintMsg = document.getElementById('hint-msg');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalClose = document.getElementById('modal-close');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060710);
    scene.fog = new THREE.FogExp2(0x060710, 0.012);

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 200);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // ==========================================
    // 2. ルック設定（Blender同期 ＋ 調整パネル）
    // ==========================================
    // Blenderのビュー変換 → Three.jsのトーンマッピング
    const TONE_MAPPINGS = {
      'None': THREE.NoToneMapping,
      'Linear (Blender: Standard)': THREE.LinearToneMapping,
      'ACES Filmic': THREE.ACESFilmicToneMapping,
      'AgX (Blender: AgX)': THREE.AgXToneMapping
    };
    function toneMappingFromBlender(viewTransform) {
      switch (viewTransform) {
        case 'AgX': return 'AgX (Blender: AgX)';
        case 'Filmic': return 'ACES Filmic'; // Three.jsにFilmicは無いため最も近いACESで近似
        case 'Standard':
        case 'Khronos PBR Neutral': return 'Linear (Blender: Standard)';
        default: return 'Linear (Blender: Standard)';
      }
    }

    const cm = blenderData?.colorManagement;
    const look = {
      toneMapping: blenderData ? toneMappingFromBlender(cm?.viewTransform) : 'ACES Filmic',
      exposureEV: blenderData ? (cm?.exposure ?? 0) : 0,
      envIntensity: 1.0,
      worldBackground: false,
      fogDensity: 0.012,
      // v13の固定ライト（lights.jsonがある場合は既定でオフ）
      ambient: blenderData ? 0.0 : 20.0,
      moon: blenderData ? 0.0 : 8.0,
      // Blenderライト全体の倍率
      lightScale: 1.0,
      bloomStrength: 0.85,
      bloomRadius: 0.4,
      bloomThreshold: 0.65,
      // ロゴ看板（rogo1 / rogo2）の発光の強さ（v13は2.5）
      logoGlow: 0.6,
      shadowArea: 12,
      parallax: true,
      lights: {} // ライト名 → { intensity, color, visible }
    };
    if (savedLook) {
      const { lights: savedLights, ...rest } = savedLook;
      Object.assign(look, rest);
      if (savedLights) look.lights = savedLights;
      console.log('[look] look.json を適用しました');
    }
    if (cm && cm.look && cm.look !== 'None') console.warn(`[look] Blenderのルック "${cm.look}" はThree.jsでは再現されません（露出/トーンマップで調整してください）`);
    if (cm && cm.gamma && Math.abs(cm.gamma - 1) > 1e-3) console.warn(`[look] Blenderのガンマ ${cm.gamma} は未対応です`);

    const ambientLight = new THREE.AmbientLight(0x141e30, look.ambient);
    scene.add(ambientLight);

    const moonLight = new THREE.DirectionalLight(0x5577aa, look.moon);
    moonLight.position.set(-6, 12, 10);
    moonLight.castShadow = true;
    scene.add(moonLight);

    // Blenderから復元したライト一覧 { light, base: {intensity, color}, data }
    const blenderLights = [];
    const allMaterials = new Set();
    const logoMaterials = new Set();
    let sceneCenter = new THREE.Vector3();

    // 3. ポストプロセス（Bloom → OutputPassでトーンマップ＆sRGB変換を最後に一括適用）
    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      look.bloomStrength,
      look.bloomRadius,
      look.bloomThreshold
    );
    const outputPass = new OutputPass();

    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);
    composer.addPass(outputPass);

    // ==========================================
    // Blenderライト → Three.js ライトの復元
    // ==========================================
    const MAX_POINT_SHADOWS = 2; // ポイントライトの影は1灯で6回描画するため上限を設ける

    function buildBlenderLights() {
      if (!blenderData) return;
      RectAreaLightUniformsLib.init();
      const group = new THREE.Group();
      group.name = 'BlenderLights';
      let pointShadowCount = 0;

      blenderData.lights.forEach((d) => {
        const color = new THREE.Color().setRGB(d.color[0], d.color[1], d.color[2], THREE.LinearSRGBColorSpace);
        const pos = new THREE.Vector3().fromArray(d.position);
        const ax = new THREE.Vector3().fromArray(d.axisX);
        const ay = new THREE.Vector3().fromArray(d.axisY);
        const az = new THREE.Vector3().fromArray(d.axisZ);
        const dir = az.clone().negate(); // Blenderのライトはローカル -Z を照らす
        let light = null;

        if (d.type === 'POINT') {
          light = new THREE.PointLight(color, d.intensity, 0, 2);
          light.position.copy(pos);
          if (d.castShadow && pointShadowCount < MAX_POINT_SHADOWS) {
            light.castShadow = true;
            light.shadow.mapSize.set(1024, 1024);
            pointShadowCount++;
          }
        } else if (d.type === 'SPOT') {
          light = new THREE.SpotLight(color, d.intensity, 0, d.angle, d.penumbra, 2);
          light.position.copy(pos);
          light.target.position.copy(pos).add(dir);
          group.add(light.target);
          if (d.castShadow) {
            light.castShadow = true;
            light.shadow.mapSize.set(1024, 1024);
          }
        } else if (d.type === 'SUN') {
          light = new THREE.DirectionalLight(color, d.intensity);
          light.userData.sunDir = dir.clone();
          if (d.castShadow) {
            light.castShadow = true;
            light.shadow.mapSize.set(2048, 2048);
          }
          group.add(light.target);
        } else if (d.type === 'AREA') {
          // 円形/楕円は同じ面積の矩形で近似
          const k = (d.shape === 'DISK' || d.shape === 'ELLIPSE') ? Math.sqrt(Math.PI / 4) : 1;
          light = new THREE.RectAreaLight(color, d.intensity, d.width * k, d.height * k);
          light.position.copy(pos);
          light.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(ax, ay, az));
        }

        if (!light) return;
        light.name = d.name;
        if (light.shadow) {
          light.shadow.bias = -0.0004;
          light.shadow.normalBias = 0.02;
        }
        group.add(light);
        blenderLights.push({ light, data: d, base: { intensity: d.intensity, color: '#' + color.getHexString(THREE.SRGBColorSpace) } });
        if (!look.lights[d.name]) {
          look.lights[d.name] = { intensity: d.intensity, color: '#' + color.getHexString(THREE.SRGBColorSpace), visible: true };
        }
      });

      scene.add(group);
      const areaCount = blenderLights.filter(l => l.data.type === 'AREA').length;
      if (areaCount) console.info(`[look] エリアライト ${areaCount} 灯は RectAreaLight で再現（Three.jsの仕様で影は出ません）`);
    }

    // サンライトの影範囲をシーン中心に合わせる
    function updateSunShadows() {
      blenderLights.forEach(({ light }) => {
        if (!light.isDirectionalLight) return;
        const dir = light.userData.sunDir;
        const r = look.shadowArea;
        light.target.position.copy(sceneCenter);
        light.position.copy(sceneCenter).addScaledVector(dir, -r * 2);
        const cam = light.shadow.camera;
        cam.left = -r; cam.right = r; cam.top = r; cam.bottom = -r;
        cam.near = 0.1; cam.far = r * 4;
        cam.updateProjectionMatrix();
      });
    }

    // ワールド（環境光）の再現：HDRIがあれば読み込み、無ければ単色環境
    async function buildEnvironment() {
      if (!blenderData) return;
      const world = blenderData.world || {};
      const pmrem = new THREE.PMREMGenerator(renderer);
      let envTex = null;
      let bgTex = null;

      if (world.hdri) {
        const url = './' + world.hdri;
        const isExr = world.hdri.toLowerCase().endsWith('.exr');
        try {
          const tex = await (isExr ? new EXRLoader() : new RGBELoader()).loadAsync(url);
          tex.mapping = THREE.EquirectangularReflectionMapping;
          envTex = pmrem.fromEquirectangular(tex).texture;
          bgTex = tex;
          // Three.js r160 は環境マップの回転に未対応のため強さのみ反映
          look.envIntensity = savedLook?.envIntensity ?? world.strength;
          if (world.rotationZ) console.warn('[look] HDRIの回転はThree.js r160では未対応です（r162以降で対応可能）');
        } catch (e) {
          console.warn(`[look] HDRI "${url}" を読み込めませんでした。HTMLと同じフォルダに置いてください。単色環境で代用します。`, e);
        }
      }

      if (!envTex) {
        // 強さを色に掛けた単色の環境をPMREMで生成
        const c = new THREE.Color().setRGB(world.color?.[0] ?? 0.05, world.color?.[1] ?? 0.05, world.color?.[2] ?? 0.05, THREE.LinearSRGBColorSpace)
          .multiplyScalar(world.strength ?? 1);
        const envScene = new THREE.Scene();
        envScene.background = c;
        envTex = pmrem.fromScene(envScene).texture;
        bgTex = c;
      }

      scene.environment = envTex;
      scene.userData.worldBackground = bgTex;
      pmrem.dispose();
    }

    // ルック値をシーンへ反映
    const defaultBackground = new THREE.Color(0x060710);
    function applyLook() {
      renderer.toneMapping = TONE_MAPPINGS[look.toneMapping] ?? THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = Math.pow(2, look.exposureEV);
      ambientLight.intensity = look.ambient;
      moonLight.intensity = look.moon;
      scene.fog.density = look.fogDensity;
      scene.background = (look.worldBackground && scene.userData.worldBackground) ? scene.userData.worldBackground : defaultBackground;
      bloomPass.strength = look.bloomStrength;
      bloomPass.radius = look.bloomRadius;
      bloomPass.threshold = look.bloomThreshold;
      allMaterials.forEach((m) => { if ('envMapIntensity' in m) m.envMapIntensity = look.envIntensity; });
      logoMaterials.forEach((m) => { m.emissiveIntensity = look.logoGlow; });
      blenderLights.forEach(({ light, data }) => {
        const s = look.lights[data.name];
        if (!s) return;
        light.visible = s.visible;
        light.intensity = s.intensity * look.lightScale;
        light.color.set(s.color);
      });
      updateSunShadows();
    }

    // ==========================================
    // ルック調整パネル（?debug を付けて開く or「L」キーで表示切替）

    // 4. カメラスロット定義
    const cameraSlots = {
      cut1: { pos: new THREE.Vector3(11.98, 2.94, 12.49), quat: new THREE.Quaternion(0.010, 0.409, -0.005, 0.912), fov: 33 },

      cut4: { pos: new THREE.Vector3(0.01, 1.07, 4.09),   quat: new THREE.Quaternion(0.011, 0, 0, 1.0), fov: 33 }

    let currentPos = cameraSlots.cut1.pos.clone();
    let currentQuat = cameraSlots.cut1.quat.clone();
    let currentFov = cameraSlots.cut1.fov;

    // 縦長画面（スマホ）では横の見える範囲が狭くなるので、16:9 相当の横幅が入るよう縦の画角を広げる
    const REF_ASPECT = 16 / 9;
    const MAX_FIT_FOV = 72;
    function fitFov(fov) {
      const aspect = window.innerWidth / window.innerHeight;
      if (aspect >= REF_ASPECT) return fov;
      const rad = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(fov) / 2) * (REF_ASPECT / aspect));
      return Math.min(MAX_FIT_FOV, Math.max(fov, THREE.MathUtils.radToDeg(rad)));
    }

    // 5. 作品データ（並び順 = 作品番号 No.01〜）
