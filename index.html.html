    const productItems = [];
    let hoveredItem = null;
    let fallingProduct = null;

    // 親がS_で始まる商品かどうかを再帰的に探すヘルパー関数
    function findProductItem(obj) {
      let curr = obj;
      while (curr) {
        const found = productItems.find(p => p.mesh === curr);
        if (found) return found;
        curr = curr.parent;
      }
      return null;
    }

    // 7. GLBモデル読み込み（進捗をローディング画面に表示）
    const loaderEl = document.getElementById('loader');
    const loaderBar = document.getElementById('loader-bar');
    const loaderStatus = document.getElementById('loader-status');
    function setLoaderProgress(p) {
      const pct = Math.round(Math.min(1, p) * 100);
      loaderBar.style.width = pct + '%';
      loaderStatus.textContent = pct >= 100 ? 'READY' : `LOADING ${pct}%`;
    }
    const loader = new GLTFLoader();
    const modelPath = './jihanki.glb';

    loader.load(
      modelPath,
      (gltf) => {
        const root = gltf.scene;

        root.traverse((node) => {
          const lowerName = node.name.toLowerCase();

          // カメラの自動同期
          ['cut1', 'cut2', 'cut3', 'cut4'].forEach((key) => {
            if (lowerName === key || lowerName.includes(key)) {
              node.updateWorldMatrix(true, false);
              const wPos = new THREE.Vector3();
              const wQuat = new THREE.Quaternion();
              node.getWorldPosition(wPos);
              node.getWorldQuaternion(wQuat);

              cameraSlots[key].pos.copy(wPos);
              cameraSlots[key].quat.copy(wQuat);

              if (node.isCamera) {
                cameraSlots[key].fov = node.fov;
              }
            }
          });

          // 商品オブジェクト（S_で始まるノード）のセットアップ
          if (node.name.startsWith('S_')) {
            const mats = [];
            const outlines = [];

            // 子メッシュを含めてすべて走査し、マテリアルのクローンと発光輪郭（Outline）を生成
            node.traverse((child) => {
              if (child.isMesh) {
                if (Array.isArray(child.material)) {
                  child.material = child.material.map(m => {
                    const cloned = m.clone();
                    cloned.emissive = new THREE.Color(0x00f0ff);
                    cloned.emissiveIntensity = 0.0;
                    mats.push(cloned);
                    return cloned;
                  });
                } else if (child.material) {
                  const cloned = child.material.clone();
                  cloned.emissive = new THREE.Color(0x00f0ff);
                  cloned.emissiveIntensity = 0.0;
                  child.material = cloned;
                  mats.push(cloned);
                }

                // オブジェクトの周りが光るネオンエッジラインを作成
                if (child.geometry) {
                  const edgesGeo = new THREE.EdgesGeometry(child.geometry, 28);
                  const edgesMat = new THREE.LineBasicMaterial({
                    color: 0x00f0ff,
                    transparent: true,
                    opacity: 0.0,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                  });
                  const line = new THREE.LineSegments(edgesGeo, edgesMat);
                  line.scale.setScalar(1.035); // ほんの少し外側に広げて輪郭を際立たせる
                  line.raycast = () => {};     // Raycasterの邪魔をしないようにする
                  child.add(line);
                  outlines.push(edgesMat);
                }
              }
            });

            productItems.push({
              mesh: node,
              materials: mats,
              outlineMaterials: outlines,
              initialPos: node.position.clone(),
              initialRot: node.rotation.clone(),
              velocity: 0,
              isFalling: false,
              isLanded: false,
              glowIntensity: 0.0
            });
          }

          // GLB内にライト（KHR_lights_punctual）がある場合：lights.jsonと二重にならないよう非表示
          if (node.isLight && blenderData) {
            node.visible = false;
            console.info(`[look] GLB内のライト "${node.name}" は lights.json 優先のため無効化しました`);
          }

          // 一般マテリアル・透過・発光設定
          if (node.isMesh) {
            node.castShadow = true;
            node.receiveShadow = true;
            (Array.isArray(node.material) ? node.material : [node.material]).forEach(m => m && allMaterials.add(m));

            // ガラスが商品のクリック・ホバー判定を遮らないようにRaycasterをスルーさせる
            if (lowerName.includes('glass')) {
              node.raycast = () => {};
            }

            const fixMat = (mat) => {
              if (!mat) return;
              const matName = (mat.name || '').toLowerCase();
              // 「平面.001」はローダーで「平面001」に変換されるため、元の名前で判定
              const meshName = (rawName(node) + ' ' + rawName(node.parent || node)).toLowerCase();

              // ① ガラスパーツ
              if (meshName.includes('glass')) {
                mat.transparent = true;
                mat.opacity = 0.35;
                mat.roughness = 0.05;
                mat.depthWrite = false;
              } 
              // ② フェンス（アルファテスト型抜き）
              else if (meshName.includes('fence') || matName.includes('fence')) {
                mat.transparent = true;
                mat.alphaTest = 0.5;
                mat.depthWrite = true;
                mat.side = THREE.DoubleSide;
              }
              // ③ 自販機ロゴ看板（黒背景透過＋ネオン発光）
              else if (
                meshName.includes('平面.001') || 
                meshName.includes('平面.003') || 
                matName.includes('マテリアル.004') ||
                matName.includes('rogo') ||
                meshName.includes('rogo')
              ) {
                mat.transparent = true;
                mat.depthWrite = false;
                mat.side = THREE.DoubleSide;
                mat.blending = THREE.AdditiveBlending;
                if (mat.emissive) {
                  mat.emissive.setHex(0xffffff);
                  mat.emissiveIntensity = look.logoGlow; // 旧: 2.5（強すぎたため抑制）
                  logoMaterials.add(mat);
                }
              }
              // ④ その他オブジェクト
              else {
                mat.transparent = false;
                mat.opacity = 1.0;
                mat.depthWrite = true;
                mat.depthTest = true;
              }

              // 一般プロップの白飛び防止
              // （lights.jsonがある時はBlenderの発光値＝GLBの値をそのまま使う）
              const isPartOfProduct = findProductItem(node) !== null;
              if (mat.emissive && !isPartOfProduct && !blenderData) {
                if (lowerName.includes('trush') || lowerName.includes('ko-n')) {
                  mat.emissive.setHex(0x000000);
                  mat.emissiveIntensity = 0.0;
                } else if (lowerName.includes('tatemono') || lowerName.includes('sign')) {
                  mat.emissiveIntensity = 2.0;
                }
              }
            };

            if (Array.isArray(node.material)) {
              node.material.forEach(fixMat);
            } else {
              fixMat(node.material);
            }
          }
        });

        // 初期カメラ位置の適用
        currentPos.copy(cameraSlots.cut1.pos);
        currentQuat.copy(cameraSlots.cut1.quat);
        camera.position.copy(currentPos);
        camera.quaternion.copy(currentQuat);
        currentFov = cameraSlots.cut1.fov;
        camera.fov = fitFov(currentFov);
        camera.updateProjectionMatrix();

        scene.add(root);

        // 影・サン位置の基準：商品（＝自販機）の中心、無ければモデル全体の中心
        const centerBox = new THREE.Box3();
        if (productItems.length) productItems.forEach(p => centerBox.expandByObject(p.mesh));
        else centerBox.setFromObject(root);
        centerBox.getCenter(sceneCenter);

        // 商品の発光用クローンマテリアルも環境光の対象に含める
        productItems.forEach(p => p.materials.forEach(m => allMaterials.add(m)));

        setupMachines(root);
        updateUIForCut('cut1');

        buildBlenderLights();
        buildEnvironment().then(() => {
          applyLook();
          buildGUI();
          // 最初のフレームを描いてからローディングを消す
          requestAnimationFrame(() => {
            setLoaderProgress(1);
            document.getElementById('loading').style.display = 'none'; // テスト・互換用
            loaderEl.classList.add('hidden');
            setTimeout(() => { loaderEl.style.display = 'none'; }, 1000);
            openFromHash();
          });
        });
      },
      (xhr) => {
        if (xhr.lengthComputable && xhr.total > 0) setLoaderProgress(xhr.loaded / xhr.total * 0.95);
        else loaderStatus.textContent = `LOADING ${(xhr.loaded / 1048576).toFixed(0)} MB`;
      },
      (err) => {
        console.error('GLTF Load Error:', err);
        loaderEl.classList.add('error');
        loaderStatus.textContent = `読み込みエラー：${modelPath} を確認してください（ローカルでは簡易サーバー経由で開く必要があります）`;
      }
    );

    // ==========================================
    // 8. 画面フロー（Cut1 タイトル → Cut2 自販機選択 → Cut3 商品選択 → Cut4 取り出し口）
    // ==========================================
    const $ = (id) => document.getElementById(id);
    const titleScreen = $('title-screen');
    const startBtn = $('start-btn');
    const backBtn = $('back-btn');
    const retryBtn = $('retry-btn');
    const topbar = $('topbar');
    const brandBtn = $('brand');
    const stepsEl = $('steps');
    const itemLabel = $('item-label');
    const itemLabelNo = $('item-label-no');
    const itemLabelTitle = $('item-label-title');
    const itemLabelSub = $('item-label-sub');
    const toastEl = $('toast');

    const HINTS = {
      cut1: '',
      cut2: '見たい自販機を選ぶ',
      cut3: '好きな商品を選ぶ',
      cut4: '取り出し口の商品をクリックして作品を閲覧'
    };
    const CUT_ORDER = ['cut1', 'cut2', 'cut3', 'cut4'];
    const BACK_TARGET = { cut2: 'cut1', cut3: 'cut2', cut4: 'cut3' };
    const CAMERA_DURATION_SEC = 1.1;

    let isTransitioning = false;
    let transitionId = 0;
    let purchaseToken = 0;

    // 全商品を棚の初期位置に戻す（Cut4以外へ移動する時に必ず実行）
    function resetProducts() {
      purchaseToken++; // 進行中の購入演出（コイン音→落下）をキャンセル
      stopAllSamples();
      productItems.forEach(item => {
        item.isPaying = false;
        item.isFalling = false;
        item.isLanded = false;
        item.velocity = 0;
        item.mesh.position.copy(item.initialPos);
        item.mesh.rotation.copy(item.initialRot);
      });
      fallingProduct = null;
    }

    function setHint(text) {
      if (text) {
        hintMsg.textContent = text;
        hintMsg.style.opacity = '1';
      } else {
        hintMsg.style.opacity = '0';
      }
    }

    function updateUIForCut(cutKey) {
      const isTitle = cutKey === 'cut1';
      titleScreen.classList.toggle('hidden', !isTitle);
      topbar.classList.remove('hidden');
      brandBtn.style.opacity = isTitle ? '0' : '1';
      brandBtn.style.pointerEvents = isTitle ? 'none' : 'auto';
      backBtn.classList.toggle('hidden', isTitle);
      stepsEl.classList.toggle('hidden', isTitle);
      retryBtn.classList.add('hidden');
      const idx = CUT_ORDER.indexOf(cutKey);
      stepsEl.querySelectorAll('.step').forEach((el) => {
        const i = CUT_ORDER.indexOf(el.dataset.cut);
        el.classList.toggle('active', i === idx);
        el.classList.toggle('done', i < idx);
      });
      setHint(HINTS[cutKey]);
    }

    function switchCamera(cutKey) {
      activeCutKey = cutKey;

      // Cut4以外へ移動する時は、落下・着地済みの商品も含めて必ずリセット
      if (cutKey !== 'cut4') resetProducts();
      setHovered(null);
      hoveredMachine = null;
      touchArmedItem = null;
      hideLabel();
      updateUIForCut(cutKey);

      const target = cameraSlots[cutKey];
      const startPos = currentPos.clone();
      const startQuat = currentQuat.clone();
      const startFov = currentFov;
      const myId = ++transitionId;
      const startTime = performance.now();
      isTransitioning = true;

      function step() {
        if (myId !== transitionId) return;
        const progress = Math.min(1, (performance.now() - startTime) / (CAMERA_DURATION_SEC * 1000));
        const t = progress * progress * (3 - 2 * progress); // smoothstep
        currentPos.lerpVectors(startPos, target.pos, t);
        currentQuat.slerpQuaternions(startQuat, target.quat, t);
        currentFov = THREE.MathUtils.lerp(startFov, target.fov, t);
        camera.fov = fitFov(currentFov);
        camera.updateProjectionMatrix();

        if (progress < 1.0) {
          requestAnimationFrame(step);
        } else {
          isTransitioning = false;
          if (cutKey === 'cut4' && fallingProduct && fallingProduct.isLanded) retryBtn.classList.remove('hidden');
        }
      }
      step();
    }

    function goBack() {
      const to = BACK_TARGET[activeCutKey];
      if (!to) return;
      playBackSE();
      switchCamera(to);
    }

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      initAudio();
      playConfirmSE();
      switchCamera('cut2');
    });
    backBtn.addEventListener('click', (e) => { e.stopPropagation(); goBack(); });
    retryBtn.addEventListener('click', (e) => { e.stopPropagation(); playBackSE(); switchCamera('cut3'); });
    brandBtn.addEventListener('click', (e) => { e.stopPropagation(); if (activeCutKey !== 'cut1') { playBackSE(); switchCamera('cut1'); } });

    // ボタンに触れた時の小さな音
    document.addEventListener('pointerover', (e) => {
      if (e.pointerType !== 'mouse' || !audioCtx) return;
      const btn = e.target.closest && e.target.closest('.btn, .work-item, .modal-btn, .modal-nav button, .text-link');
      if (btn && !btn.contains(e.relatedTarget)) playUITickSE();
    });

    function showToast(text, ms = 2600) {
      toastEl.textContent = text;
      toastEl.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toastEl.classList.remove('show'), ms);
    }

    // サウンドON/OFF
    const soundBtn = $('sound-btn');
    function renderSoundIcon() {
      $('icon-sound-on').style.display = soundOn ? '' : 'none';
      $('icon-sound-off').style.display = soundOn ? 'none' : '';
      soundBtn.setAttribute('aria-pressed', String(!soundOn));
      soundBtn.title = soundOn ? 'サウンド：ON' : 'サウンド：OFF';
    }
    soundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      initAudio();
      setSoundOn(!soundOn);
      if (soundOn) playUITickSE();
    });
    document.addEventListener('soundchange', renderSoundIcon);
    renderSoundIcon();

    // ==========================================
    // 9. 自販機・商品のホバー ＆ クリック判定
    // ==========================================
    const raycaster = new THREE.Raycaster();
    const mouseNorm = new THREE.Vector2();
    let hoveredMachine = null; // 'left' | 'right' | null
    let lastPointerType = 'mouse';
    let touchArmedItem = null; // スマホ：1回目のタップで名前表示、2回目で購入

    // 自販機の当たり判定（見えない箱）とホバー時のネオン枠
    const machines = {};
    // ロゴは GLB によって「rogo1」または「平面.001」という名前なので両方を探す
    const MACHINE_PARTS = {
      left: ['jihank_hontai', 'jihank_shouhinback', 'rogo1', '平面.001'],
      right: ['jihanki_hontai2', 'jihanki_shouhinback2', 'rogo2', '平面.003']
    };

    function setupMachines(root) {
      Object.entries(MACHINE_PARTS).forEach(([side, names]) => {
        const box = new THREE.Box3();
        root.traverse((obj) => {
          if (names.includes(rawName(obj)) || names.includes(obj.name)) box.expandByObject(obj);
        });
        if (box.isEmpty()) return;
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        const proxy = new THREE.Mesh(new THREE.BoxGeometry(size.x, size.y, size.z), new THREE.MeshBasicMaterial());
        proxy.position.copy(center);
        proxy.visible = false; // 非表示でもRaycasterには当たる
        proxy.userData.side = side;
        scene.add(proxy);

        const enabled = side === 'left';
        const frameMat = new THREE.LineBasicMaterial({
          color: enabled ? 0x00f0ff : 0x7b88a8,
          transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false
        });
        const frame = new THREE.LineSegments(
          new THREE.EdgesGeometry(new THREE.BoxGeometry(size.x + 0.08, size.y + 0.08, size.z + 0.08)),
          frameMat
        );
        frame.position.copy(center);
        frame.raycast = () => {};
        scene.add(frame);

        machines[side] = { proxy, frameMat, enabled, glow: 0 };
      });
    }

    function setHovered(next) {
      if (next !== hoveredItem && next) playHoverSE(workIndexOf(next.mesh.name));
      hoveredItem = next;
    }

    function showLabel(x, y, no, title, sub, { disabled = false, got = false } = {}) {
      itemLabelNo.innerHTML = '';
      if (no) {
        itemLabelNo.textContent = no;
        if (got) {
          const g = document.createElement('span');
          g.className = 'got';
          g.textContent = '★ GET';
          itemLabelNo.appendChild(g);
        }
      }
      itemLabelTitle.textContent = title;
      itemLabelSub.textContent = sub;
      itemLabel.classList.toggle('disabled', disabled);
      // 画面端ではみ出さないよう左右・上下を反転
      const w = itemLabel.offsetWidth || 220;
      const h = itemLabel.offsetHeight || 60;
      const lx = x + 18 + w > window.innerWidth ? x - 18 - w : x + 18;
      const ly = y + 18 + h > window.innerHeight ? y - 18 - h : y + 18;
      itemLabel.style.transform = `translate(${lx}px, ${ly}px)`;
      itemLabel.classList.add('show');
    }
    function hideLabel() { itemLabel.classList.remove('show'); }

    function showProductLabel(item, x, y) {
      const key = workKeyOf(item.mesh.name);
      const data = key ? projectData[key] : null;
      const sub = activeCutKey === 'cut3'
        ? (lastPointerType === 'touch' ? 'もう一度タップで購入' : 'クリックで購入')
        : 'クリックで作品を見る';
      showLabel(x, y, key ? `No.${workNo(key)}` : '', data ? data.title : item.mesh.name, sub, { got: key && collected.has(key) });
    }

    function pickFromEvent(e, objects) {
      mouseNorm.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouseNorm.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouseNorm, camera);
      return raycaster.intersectObjects(objects, true);
    }
    function pickMachine(e) {
      const proxies = Object.values(machines).map(m => m.proxy);
      if (!proxies.length) return null;
      const hits = pickFromEvent(e, proxies);
      return hits.length ? hits[0].object.userData.side : null;
    }
    function pickProduct(e) {
      const hits = pickFromEvent(e, productItems.map(item => item.mesh));
      return hits.length ? findProductItem(hits[0].object) : null;
    }

    const isOverlayOpen = () => modalOverlay.classList.contains('open') || !!openDrawerEl;

    window.addEventListener('pointerdown', (e) => { lastPointerType = e.pointerType || 'mouse'; }, true);

    // クリック処理
    window.addEventListener('click', (e) => {
      if (isTransitioning || isOverlayOpen()) return;
      if (e.target.closest && e.target.closest('button, a, .lil-gui, #topbar, .drawer')) return;
      if (e.target !== renderer.domElement && !container.contains(e.target)) return;

      // 【Cut 2】左の自販機をクリック ➔ Cut 3 へ
      if (activeCutKey === 'cut2') {
        const side = pickMachine(e);
        if (side && machines[side].enabled) {
          playConfirmSE();
          hideLabel();
          switchCamera('cut3');
        } else if (side === 'right') {
          playBackSE();
          showToast('こちらの自販機は準備中です');
        }
        return;
      }

      const item = pickProduct(e);
      if (!item) {
        touchArmedItem = null;
        if (lastPointerType === 'touch') { setHovered(null); hideLabel(); }
        return;
      }

      // 【Cut 3】棚の商品をクリック ➔ コイン投入音 → 落下 ＆ Cut 4へ
      if (activeCutKey === 'cut3' && !fallingProduct) {
        // スマホは「1回目のタップ＝名前を見る」「2回目＝購入」
        if (lastPointerType === 'touch' && touchArmedItem !== item) {
          touchArmedItem = item;
          setHovered(item);
          showProductLabel(item, e.clientX, e.clientY);
          return;
        }
        touchArmedItem = null;
        hideLabel();
        setHovered(null);
        startPurchase(item);
      }

      // 【Cut 4】取り出し口に落ちた商品をクリック ➔ 作品モーダル
      else if (activeCutKey === 'cut4' && item.isLanded) {
        hideLabel();
        const key = workKeyOf(item.mesh.name);
        if (key) openProjectModal(key, { fromPurchase: true });
      }
    });

    // 購入演出：コイン投入音が鳴り終わってから商品を落とす
    function startPurchase(item) {
      const token = ++purchaseToken;
      fallingProduct = item;
      item.isPaying = true; // コイン投入中は商品を光らせたまま手前に浮かせておく
      setHint('コイン投入中…');
      playPressSE(workIndexOf(item.mesh.name));

      // コイン音 → 落下音 をオーディオの時計で続けて予約（音どうしの隙間・ズレが出ない）
      let waitSec = 0.3;
      let dropAudioStart = null;
      const coin = playSample('coin', audioCtx ? audioCtx.currentTime + 0.05 : 0);
      if (coin) {
        const dropAt = coin.start + coin.duration - COIN_TO_DROP_OVERLAP;
        const drop = playSample('drop', dropAt);
        if (drop) dropAudioStart = drop.start;
        waitSec = dropAt - audioCtx.currentTime;
      }

      const isAlive = () => token === purchaseToken && fallingProduct === item;
      const cameraAt = Math.max(0, waitSec + FALL_DURATION - CAMERA_DURATION_SEC);

      setTimeout(() => {
        if (isAlive() && activeCutKey === 'cut3') switchCamera('cut4');
      }, cameraAt * 1000);

      // 少し早めに落下状態へ。実際の動き出しは落下音の再生開始に合わせる（animate側）
      setTimeout(() => {
        if (!isAlive()) return;
        if (dropAudioStart === null && !coin) {
          const drop = playSample('drop');
          if (drop) dropAudioStart = drop.start;
        }
        item.isPaying = false;
        item.isFalling = true;
        item.fallStart = performance.now();
        item.fallAudioStart = dropAudioStart; // null の時は performance.now() 基準
        item.fallFromPos = item.mesh.position.clone();
        item.fallFromRot = item.mesh.rotation.clone();
        item.dropSampleUsed = dropAudioStart !== null;
      }, Math.max(0, waitSec * 1000 - 40));
    }

    // 着地した瞬間に呼ばれる（animate から）
    function onProductLanded(item) {
      if (!item.dropSampleUsed) playDropClunkSE();
      playGetSE();
      if (activeCutKey === 'cut4') retryBtn.classList.remove('hidden');
      const key = workKeyOf(item.mesh.name);
      const data = key ? projectData[key] : null;
      setHint(data ? `「${data.title}」が出てきた！ クリックして見る` : HINTS.cut4);
    }

    // ホバー処理（光彩・輪郭発光・名前ラベル・効果音）
    const mouse = new THREE.Vector2(0, 0);
    const smoothMouse = new THREE.Vector2(0, 0);

    window.addEventListener('pointermove', (e) => {
      mouse.x = (e.clientX / window.innerWidth - 0.5) * 2;
      mouse.y = -(e.clientY / window.innerHeight - 0.5) * 2;
      if (e.pointerType === 'touch') return;

      const overUI = e.target !== renderer.domElement;
      if (isTransitioning || overUI || isOverlayOpen()) {
        hideLabel();
        if (!overUI) document.body.style.cursor = 'default';
        if (overUI || isOverlayOpen()) { setHovered(null); hoveredMachine = null; }
        return;
      }

      // 【Cut 2】自販機のホバー
      if (activeCutKey === 'cut2') {
        const side = pickMachine(e);
        if (side !== hoveredMachine && side) playHoverSE(side === 'left' ? 5 : 0);
        hoveredMachine = side;
        if (side === 'left') {
          showLabel(e.clientX, e.clientY, 'MACHINE 01', 'PORTFOLIO VENDING', `クリックして商品を見る（${WORK_KEYS.length}作品）`);
          document.body.style.cursor = 'pointer';
        } else if (side === 'right') {
          showLabel(e.clientX, e.clientY, 'MACHINE 02', 'COMING SOON', '準備中です', { disabled: true });
          document.body.style.cursor = 'not-allowed';
        } else {
          hideLabel();
          document.body.style.cursor = 'default';
        }
        return;
      }

      // 【Cut 3 / Cut 4】商品のホバー
      if ((activeCutKey === 'cut3' && !fallingProduct) || activeCutKey === 'cut4') {
        let next = pickProduct(e);
        if (activeCutKey === 'cut4' && next && !next.isLanded) next = null;
        setHovered(next);
        if (hoveredItem) showProductLabel(hoveredItem, e.clientX, e.clientY);
        else hideLabel();
        document.body.style.cursor = hoveredItem ? 'pointer' : 'default';
        return;
      }

      setHovered(null);
      hideLabel();
      document.body.style.cursor = 'default';
    });

    // ==========================================
    // 10. 作品モーダル / 作品一覧 / ABOUT / コレクション
    // ==========================================
    const WORK_KEYS = Object.keys(projectData);
    const workNo = (key) => String(WORK_KEYS.indexOf(key) + 1).padStart(2, '0');
    function workKeyOf(meshName) {
      // 長いキーから先に照合（例：S_create と S_create_01 の取り違え防止）
      return [...WORK_KEYS].sort((a, b) => b.length - a.length).find(k => meshName.startsWith(k)) || null;
    }
    const workIndexOf = (meshName) => Math.max(0, WORK_KEYS.indexOf(workKeyOf(meshName)));

    // --- コレクション（購入した作品を記録：このブラウザだけに保存） ---
    const COLLECT_KEY = 'vm-portfolio-collected';
    const collected = new Set();
    try { JSON.parse(localStorage.getItem(COLLECT_KEY) || '[]').forEach(k => WORK_KEYS.includes(k) && collected.add(k)); } catch (e) {}
    function saveCollected() { try { localStorage.setItem(COLLECT_KEY, JSON.stringify([...collected])); } catch (e) {} }
    function renderCollection() {
      const n = collected.size, total = WORK_KEYS.length;
      $('collect-badge').textContent = `${n}/${total}`;
      $('collect-text').textContent = `${n} / ${total}`;
      $('collect-bar').style.width = `${(n / total) * 100}%`;
      renderWorkList();
    }
    function collect(key) {
      if (collected.has(key)) return false;
      collected.add(key);
      saveCollected();
      renderCollection();
      if (collected.size === WORK_KEYS.length) {
        setTimeout(() => { playCompleteSE(); showToast('★ COMPLETE！ 全作品を手に入れました', 4200); }, 700);
      } else {
        showToast(`★ GET！ ${collected.size} / ${WORK_KEYS.length} 作品`);
      }
      return true;
    }
    $('collect-reset').addEventListener('click', () => {
      collected.clear();
      saveCollected();
      renderCollection();
      playBackSE();
    });

    // --- 作品モーダル ---
    const modalMedia = $('modal-media');
    const modalMeta = $('modal-meta');
    const modalNo = $('modal-no');
    const modalRole = $('modal-role');
    const modalTools = $('modal-tools');
    const modalLink = $('modal-link');
    let currentWorkKey = null;

    function youtubeId(url) {
      const m = String(url || '').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
      return m ? m[1] : null;
    }

    function renderMedia(key, data) {
      modalMedia.innerHTML = '';
      const yt = youtubeId(data.youtube);
      if (yt) {
        const f = document.createElement('iframe');
        f.src = `https://www.youtube-nocookie.com/embed/${yt}?rel=0`;
        f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
        f.allowFullscreen = true;
        f.title = data.title;
        modalMedia.appendChild(f);
        return;
      }
      if (data.video) {
        const v = document.createElement('video');
        Object.assign(v, { src: data.video, controls: true, playsInline: true, muted: true, loop: true, autoplay: true });
        modalMedia.appendChild(v);
        return;
      }
      if (data.image) {
        const img = document.createElement('img');
        img.src = data.image;
        img.alt = data.title;
        img.loading = 'lazy';
        modalMedia.appendChild(img);
        return;
      }
      // 画像が無い作品は番号とタイトルのカードを表示
      modalMedia.innerHTML = `<div class="grid-lines"></div><div class="placeholder"><div class="big-no">${workNo(key)}</div><div class="ph-title"></div></div>`;
      modalMedia.querySelector('.ph-title').textContent = data.title;
    }

    function chip(text, cls = '') {
      const s = document.createElement('span');
      s.className = 'chip ' + cls;
      s.textContent = text;
      return s;
    }

    function openProjectModal(key, { fromPurchase = false, silent = false } = {}) {
      const data = projectData[key];
      if (!data) return;
      currentWorkKey = key;
      if (!silent) playModalOpenSE();
      const isNew = fromPurchase && collect(key);

      renderMedia(key, data);
      modalMeta.innerHTML = '';
      if (data.category) modalMeta.appendChild(chip(data.category));
      if (data.year) modalMeta.appendChild(chip(data.year, 'plain'));
      if (collected.has(key)) modalMeta.appendChild(chip(isNew ? '★ NEW GET' : '★ GET', 'gold'));
      modalNo.textContent = `No.${workNo(key)}`;
      modalTitle.textContent = data.title;
      modalRole.textContent = data.role ? `担当：${data.role}` : '';
      modalRole.style.display = data.role ? '' : 'none';
      modalDesc.textContent = data.desc || '';
      modalTools.innerHTML = '';
      (data.tools || []).forEach(t => modalTools.appendChild(chip(t, 'plain')));
      modalTools.style.display = (data.tools && data.tools.length) ? '' : 'none';
      if (data.url) {
        modalLink.href = data.url;
        modalLink.style.display = '';
      } else {
        modalLink.style.display = 'none';
      }
      const i = WORK_KEYS.indexOf(key);
      const prevKey = WORK_KEYS[(i - 1 + WORK_KEYS.length) % WORK_KEYS.length];
      const nextKey = WORK_KEYS[(i + 1) % WORK_KEYS.length];
      $('modal-prev').textContent = `← ${projectData[prevKey].title}`;
      $('modal-next').textContent = `${projectData[nextKey].title} →`;
      $('modal-count').textContent = `${i + 1} / ${WORK_KEYS.length}`;

      modalOverlay.classList.add('open');
      hideLabel();
      try { history.replaceState(null, '', `#works/${key}`); } catch (e) {}
      $('modal-close').focus({ preventScroll: true });
    }

    function closeProjectModal() {
      if (!modalOverlay.classList.contains('open')) return;
      playModalCloseSE();
      modalOverlay.classList.remove('open');
      // 動画を止める
      setTimeout(() => { if (!modalOverlay.classList.contains('open')) modalMedia.innerHTML = ''; }, 400);
      currentWorkKey = null;
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    }

    function stepWork(dir) {
      if (!currentWorkKey) return;
      const i = WORK_KEYS.indexOf(currentWorkKey);
      const key = WORK_KEYS[(i + dir + WORK_KEYS.length) % WORK_KEYS.length];
      playPageSE(dir);
      openProjectModal(key, { silent: true });
    }

    modalClose.addEventListener('click', closeProjectModal);
    modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeProjectModal(); });
    $('modal-prev').addEventListener('click', () => stepWork(-1));
    $('modal-next').addEventListener('click', () => stepWork(1));
    $('modal-share').addEventListener('click', async () => {
      const url = location.href.split('#')[0] + `#works/${currentWorkKey}`;
      try {
        await navigator.clipboard.writeText(url);
        showToast('作品へのリンクをコピーしました');
      } catch (e) {
        showToast(url, 5000);
      }
      playUITickSE();
    });

    // --- サイドパネル（WORKS / ABOUT） ---
    const drawerBackdrop = $('drawer-backdrop');
    let openDrawerEl = null;
    function openDrawer(id) {
      initAudio();
      if (openDrawerEl && openDrawerEl.id === id) return closeDrawer();
      if (openDrawerEl) openDrawerEl.classList.remove('open');
      openDrawerEl = $(id);
      openDrawerEl.classList.add('open');
      drawerBackdrop.classList.add('open');
      hideLabel();
      whoosh(0, { dur: 0.3, from: 600, to: 2600, gain: 0.04, wet: 0.4 });
    }
    function closeDrawer() {
      if (!openDrawerEl) return;
      openDrawerEl.classList.remove('open');
      drawerBackdrop.classList.remove('open');
      openDrawerEl = null;
      whoosh(0, { dur: 0.25, from: 2400, to: 500, gain: 0.03, wet: 0.4 });
    }
    $('works-btn').addEventListener('click', (e) => { e.stopPropagation(); openDrawer('works-drawer'); });
    $('about-btn').addEventListener('click', (e) => { e.stopPropagation(); openDrawer('about-drawer'); });
    $('title-works-link').addEventListener('click', (e) => { e.stopPropagation(); openDrawer('works-drawer'); });
    drawerBackdrop.addEventListener('click', closeDrawer);
    document.querySelectorAll('.drawer-close').forEach(b => b.addEventListener('click', closeDrawer));

    function renderWorkList() {
      const list = $('work-list');
      list.innerHTML = '';
      WORK_KEYS.forEach((key) => {
        const d = projectData[key];
        const li = document.createElement('li');
        const b = document.createElement('button');
        b.className = 'work-item' + (collected.has(key) ? ' got' : '');
        b.innerHTML = '<span class="no"></span><span><div class="t"></div><div class="d"></div></span><span class="state"></span>';
        b.querySelector('.no').textContent = workNo(key);
        b.querySelector('.t').textContent = d.title;
        b.querySelector('.d').textContent = d.desc || '';
        b.querySelector('.state').textContent = collected.has(key) ? '★ GET' : '';
        b.addEventListener('click', () => { closeDrawer(); openProjectModal(key); });
        li.appendChild(b);
        list.appendChild(li);
      });
    }

    function renderAbout() {
      const body = $('about-body');
      body.innerHTML = `
        <div class="about-name"></div>
        <div class="about-school"></div>
        <p class="about-bio"></p>
        <a class="modal-btn" id="about-mail"></a>
        <div class="about-section">
          <h3>HOW TO</h3>
          <ol class="howto">
            <li>タイトルの「見る」で路地へ入ります</li>
            <li>光る自販機をクリック</li>
            <li>気になる商品にカーソルを合わせて名前を確認し、クリックで購入</li>
            <li>取り出し口に出てきた商品をクリックすると作品が見られます</li>
          </ol>
        </div>
        <div class="about-section">
          <h3>KEYBOARD</h3>
          <p class="drawer-note" style="margin-top:0">Esc：閉じる／戻る　← →：前後の作品　L：見た目の調整パネル</p>
        </div>`;
      body.querySelector('.about-name').textContent = PROFILE.name;
      body.querySelector('.about-school').textContent = PROFILE.school;
      body.querySelector('.about-bio').textContent = PROFILE.bio;
      const mail = body.querySelector('#about-mail');
      mail.href = `mailto:${PROFILE.email}`;
      mail.textContent = `✉ ${PROFILE.email}`;
    }

    // --- キーボード操作 ---
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (modalOverlay.classList.contains('open')) closeProjectModal();
        else if (openDrawerEl) closeDrawer();
        else if (!isTransitioning) goBack();
      } else if (modalOverlay.classList.contains('open') && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
        stepWork(e.key === 'ArrowRight' ? 1 : -1);
      } else if (e.key === 'Enter' && activeCutKey === 'cut1' && !isOverlayOpen() && document.activeElement === document.body && !titleScreen.classList.contains('hidden')) {
        startBtn.click();
      }
    });

    // --- URL（#works/作品キー）で作品を直接開く ---
    function openFromHash() {
      const m = location.hash.match(/^#works\/(.+)$/);
      if (m && projectData[decodeURIComponent(m[1])]) openProjectModal(decodeURIComponent(m[1]), { silent: true });
    }
    window.addEventListener('hashchange', openFromHash);

    renderAbout();
    renderCollection();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.fov = fitFov(currentFov);
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    // 11. 描画ループ
    function animate() {
      requestAnimationFrame(animate);

      smoothMouse.x += (mouse.x - smoothMouse.x) * 0.05;
      smoothMouse.y += (mouse.y - smoothMouse.y) * 0.05;

      // --- 商品缶のアニメーション・発光更新 ---
      productItems.forEach((item) => {
        if (item.isFalling) {
          const dropTargetY = 0.8;
          const dropTargetZ = 0.52;
          // 落下の進み具合は「落下音の再生位置」から計算 → 着地と「ガコン」が必ず一致する
          const elapsed = (item.fallAudioStart !== null && item.fallAudioStart !== undefined)
            ? heardAudioTime() - item.fallAudioStart
            : (performance.now() - item.fallStart) / 1000;
          const t = Math.min(1, Math.max(0, elapsed / FALL_DURATION));

          if (t < 1) {
            const from = item.fallFromPos;
            item.mesh.position.y = from.y + (dropTargetY - from.y) * t * t; // 重力加速度（等加速度）
            item.mesh.position.z = from.z + (dropTargetZ - from.z) * (1 - (1 - t) * (1 - t));

            // 落下中に横向きに倒れる回転
            const r = Math.min(1, t * 1.6);
            item.mesh.rotation.x = item.fallFromRot.x + (Math.PI / 2 - item.fallFromRot.x) * r;
            item.mesh.rotation.z = item.fallFromRot.z + (Math.PI / 6 - item.fallFromRot.z) * r;
          } else {
            // 着地した瞬間（mp3が無い時だけシンセの「ガコン！」を鳴らす）
            if (!item.isLanded) {
              item.isLanded = true;
              onProductLanded(item);
            }
            item.mesh.position.y = dropTargetY;
            item.mesh.position.z = dropTargetZ;
            item.mesh.rotation.x = Math.PI / 2;
            item.mesh.rotation.z = Math.PI / 6;
          }
        } else {
          // 棚にある時のホバー浮き出し（コイン投入中の商品も浮かせたまま）
          const isHovered = (hoveredItem === item) || item.isPaying;
          const targetZ = isHovered ? (item.initialPos.z + 0.09) : item.initialPos.z;
          item.mesh.position.z += (targetZ - item.mesh.position.z) * 0.18;
        }

        // ホバー時の発光更新（本体マテリアル＋周囲のネオン輪郭）
        const isHovered = (hoveredItem === item) || item.isPaying;
        const targetGlow = isHovered ? 2.2 : 0.0;
        item.glowIntensity += (targetGlow - item.glowIntensity) * 0.2;

        // ① 子メッシュすべてのマテリアルを発光
        item.materials.forEach((mat) => {
          mat.emissive.setHex(0x00f0ff);
          mat.emissiveIntensity = item.glowIntensity * 0.25;
        });

        // ② オブジェクトの周り（輪郭ライン）を強く発光
        item.outlineMaterials.forEach((edgeMat) => {
          edgeMat.opacity = Math.min(1.0, item.glowIntensity);
        });
      });

      // --- Cut2：自販機のネオン枠（左＝シアン、右＝準備中のグレー） ---
      Object.entries(machines).forEach(([side, m]) => {
        const on = activeCutKey === 'cut2' && hoveredMachine === side;
        const target = on ? (m.enabled ? 1.0 : 0.35) : 0.0;
        m.glow += (target - m.glow) * 0.18;
        m.frameMat.opacity = m.glow;
      });

      // --- カメラ視差（Parallax）制御 ---
      let offsetX = 0;
      let offsetY = 0;
      let rotPitch = 0;
      let rotYaw = 0;

      if (activeCutKey === 'cut3') {
        offsetX = smoothMouse.x * 0.12;
        offsetY = smoothMouse.y * 0.08;
        rotPitch = smoothMouse.y * 0.02;
        rotYaw = -smoothMouse.x * 0.03;
      } else if (activeCutKey === 'cut4') {
        offsetX = smoothMouse.x * 0.15;
        offsetY = smoothMouse.y * 0.12;
        rotPitch = smoothMouse.y * 0.05;
        rotYaw = -smoothMouse.x * 0.03;
      } else {
        offsetX = smoothMouse.x * 0.08;
        offsetY = smoothMouse.y * 0.05;
        rotPitch = smoothMouse.y * 0.012;
        rotYaw = -smoothMouse.x * 0.015;
      }

      // Blenderのレンダーと同じ構図で見比べたい時は視差をオフにできる
      if (!look.parallax) { offsetX = offsetY = rotPitch = rotYaw = 0; }

      const parallaxEuler = new THREE.Euler(rotPitch, rotYaw, 0, 'YXZ');
      const parallaxQuat = new THREE.Quaternion().setFromEuler(parallaxEuler);

      camera.position.x = currentPos.x + offsetX;
      camera.position.y = currentPos.y + offsetY;
      camera.position.z = currentPos.z;

      camera.quaternion.copy(currentQuat).multiply(parallaxQuat);

      composer.render();
    }
    animate();
  </script>
</body>
</html>
